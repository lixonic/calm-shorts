name: Build Android APK

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.0'

jobs:
  apk:
    name: Check and build offline APK
    outputs:
      artifact-name: ${{ steps.package.outputs.name }}
      signing-mode: ${{ steps.signing.outputs.mode || 'personal' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out app and bundled videos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install media inspection tools
        run: |
          if ! command -v ffprobe > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Verify bundled videos and posters
        run: python3 tools/prepare_media.py --verify-bundle

      - name: Test local content administration
        run: python3 -m unittest discover -s tools/tests -v

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties
            android/gradle.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Select Java for Flutter Android builds
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Accept Android SDK licenses
        run: |
          # sdkmanager's result determines failure; yes may exit after its pipe closes.
          set +o pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: Analyze app
        run: flutter analyze

      - name: Test app
        run: flutter test

      - name: Configure signing for trusted builds
        if: github.event_name != 'pull_request'
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = (
              'ANDROID_KEYSTORE_BASE64',
              'ANDROID_KEYSTORE_PASSWORD',
              'ANDROID_KEY_ALIAS',
              'ANDROID_KEY_PASSWORD',
          )
          values = [os.environ.get(name, '') for name in names]
          provided = [bool(value) for value in values]
          if any(provided) and not all(provided):
              raise SystemExit('Provide all four ANDROID signing secrets, or remove all four for a personal test APK.')

          mode = 'personal'
          if all(provided):
              encoded, store_password, alias, key_password = values
              key = Path('android/calm-reels-upload.jks')
              key.write_bytes(base64.b64decode(''.join(encoded.split()), validate=True))
              key.chmod(0o600)

              def escape_property(value):
                  # Java Properties uses ISO-8859-1 and UTF-16 Unicode escapes.
                  result = []
                  encoded_value = value.encode('utf-16-be')
                  for index in range(0, len(encoded_value), 2):
                      unit = int.from_bytes(encoded_value[index:index + 2], 'big')
                      char = chr(unit)
                      if unit < 0x20 or unit >= 0x7f:
                          result.append('\\u%04x' % unit)
                      elif char in '\\=:# !':
                          result.append('\\' + char)
                      else:
                          result.append(char)
                  return ''.join(result)

              properties = {
                  'storeFile': 'calm-reels-upload.jks',
                  'storePassword': store_password,
                  'keyAlias': alias,
                  'keyPassword': key_password,
              }
              config = Path('android/key.properties')
              config.write_text(''.join(f'{key}={escape_property(value)}\n' for key, value in properties.items()), encoding='ascii')
              config.chmod(0o600)
              mode = 'release'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'mode={mode}\n')
          print(f'Building a {mode} APK.')
          PY

      - name: Build APK for Android phones
        run: flutter build apk --release --target-platform android-arm,android-arm64 --build-number "$GITHUB_RUN_NUMBER"

      - name: Build Play app bundle
        run: flutter build appbundle --release --target-platform android-arm,android-arm64 --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK signature and offline library
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          candidates = list((Path(os.environ['ANDROID_HOME']) / 'build-tools').glob('*/apksigner'))
          if not candidates:
              raise SystemExit('Android SDK apksigner is missing.')
          signer = max(candidates, key=lambda path: [int(part) for part in re.findall(r'\d+', path.parent.name)])
          subprocess.run([str(signer), 'verify', '--verbose', str(apk)], check=True)

          PY
          python3 tools/verify_android.py build/app/outputs/flutter-apk/app-release.apk --report build/quality/apk.json
          python3 tools/verify_android.py build/app/outputs/bundle/release/app-release.aab --report build/quality/aab.json
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Measure Play compressed download size
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check
          target_sdk=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=build/app/outputs/bundle/release/app-release.aab --xpath='/manifest/uses-sdk/@android:targetSdkVersion')
          test "$target_sdk" -ge 36
          keytool -genkeypair -keystore "$RUNNER_TEMP/bundle-check.jks" -storepass android -keypass android -alias check -keyalg RSA -validity 1 -dname 'CN=Temporary bundle size check'
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle=build/app/outputs/bundle/release/app-release.aab --output="$RUNNER_TEMP/calm.apks" --ks="$RUNNER_TEMP/bundle-check.jks" --ks-pass=pass:android --ks-key-alias=check --key-pass=pass:android
          java -jar "$RUNNER_TEMP/bundletool.jar" get-size total --apks="$RUNNER_TEMP/calm.apks" > build/quality/play-download.csv
          python3 tools/check_play_download.py build/quality/play-download.csv > build/quality/play-download.json
          cat build/quality/play-download.json

      - name: Upload Play bundle and quality reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Calm-Reels-Play-bundle-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/quality/
          if-no-files-found: error
          retention-days: 1

      - name: Name APK for download
        id: package
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'personal' }}
        run: |
          mkdir -p dist
          apk_path="dist/Calm-Reels-${SIGNING_MODE}-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk_path"
          printf 'path=%s\n' "$apk_path" >> "$GITHUB_OUTPUT"
          printf 'name=Calm-Reels-%s-%s.apk\n' "$SIGNING_MODE" "$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Upload installable APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Add download link
        env:
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          SIGNING_MODE: ${{ steps.signing.outputs.mode || 'personal' }}
        run: |
          {
            printf '### Calm Reels APK\n\n'
            printf '[Download the APK](%s) (GitHub sign-in required).\n\n' "$APK_URL"
            printf 'Signing: **%s**. All videos are bundled for offline playback.\n\n' "$SIGNING_MODE"
            printf 'The APK expires from Actions after 7 days. Save a local copy.\n'
            if [[ "$SIGNING_MODE" == personal ]]; then
              printf '\nThis personal test build uses a development signing key. Another runner may use a different key; uninstall the previous personal build before installing if Android rejects the update.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing files
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for filename in ('android/key.properties', 'android/calm-reels-upload.jks'):
              Path(filename).unlink(missing_ok=True)
          PY

  android-smoke:
    name: Test native playback on 16 KB Android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Start 16 KB emulator
        run: |
          sudo chmod a+rw /dev/kvm
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-35;google_apis_ps16k;x86_64' 'emulator'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --name calm-16k --package 'system-images;android-35;google_apis_ps16k;x86_64' --device pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd calm-16k -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 4096 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 90); do
            if [[ "$(adb shell getprop sys.boot_completed | tr -d '\r')" == 1 ]]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          test "$(adb shell getconf PAGESIZE | tr -d '\r')" = 16384
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
      - name: Exercise native swipes and resource restoration
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter drive --profile --target=integration_test/performance_test.dart --driver=test_driver/performance_driver.dart --dart-define=CALM_PERF=true --dart-define=CALM_REQUIRE_16KB=true -d emulator-5554
      - name: Collect actual OS background measurements
        run: |
          flutter build apk --release --target-platform android-x64 --build-number "$GITHUB_RUN_NUMBER"
          python3 tools/profile_android.py --serial emulator-5554 --apk build/app/outputs/flutter-apk/app-release.apk --output build/performance/android-release.json
      - name: Save test reports and emulator logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Calm-Reels-Android-performance-${{ github.run_number }}
          path: |
            build/performance/
            build/integration_response_data.json
            ${{ runner.temp }}/emulator.log
          if-no-files-found: warn
          retention-days: 1

  publish:
    name: Publish public APK download
    needs: [apk, android-smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.apk.outputs.artifact-name }}
          path: dist

      - name: Prepare public download and checksum
        env:
          APK_NAME: ${{ needs.apk.outputs.artifact-name }}
          SIGNING_MODE: ${{ needs.apk.outputs.signing-mode }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          directory = Path('dist')
          apk = directory / 'Calm-Reels.apk'
          (directory / os.environ['APK_NAME']).rename(apk)
          with apk.open('rb') as source:
              digest = hashlib.file_digest(source, 'sha256').hexdigest()
          (directory / 'Calm-Reels.apk.sha256').write_text(f'{digest}  Calm-Reels.apk\n')

          notes = [
              'Calm Reels for Android 7.0 or newer.',
              '',
              '- Portrait videos play fullscreen, each once per session.',
              '- Text prompts between reels use the locally managed collection and spacing.',
              '- Swipe up, pause, and sound controls; no video titles.',
              '',
              'Download Calm-Reels.apk below. No GitHub sign-in is required.',
              f'APK size: {apk.stat().st_size / 1_000_000:.1f} MB.',
          ]
          if os.environ['SIGNING_MODE'] == 'personal':
              notes += [
                  '',
                  'This personal build uses a development signing key. If Android rejects an update, uninstall the previous personal build before installing this one.',
              ]
          (directory / 'release-notes.md').write_text('\n'.join(notes) + '\n')
          PY

      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: apk-${{ github.run_number }}-${{ github.run_attempt }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/Calm-Reels.apk dist/Calm-Reels.apk.sha256 \
            --repo "$GH_REPO" \
            --title "Calm Reels - build $GITHUB_RUN_NUMBER" \
            --notes-file dist/release-notes.md \
            --target "$RELEASE_SHA" \
            --latest
          {
            printf '### Public APK download\n\n'
            printf '[Download Calm Reels](https://github.com/%s/releases/latest/download/Calm-Reels.apk)\n\n' "$GH_REPO"
            printf 'No GitHub sign-in is required. This release download does not expire after 7 days.\n'
          } >> "$GITHUB_STEP_SUMMARY"
